<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MorvehTV Admin</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#141414" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e31b23'/%3E%3Cpath d='M12 9.5v13l10.5-6.5z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/estilos.css" />
  <link rel="stylesheet" href="css/streaming.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin">
  <section class="login" id="login">
    <form class="login-caja" id="form-login">
      <div class="marca"><span class="marca-icono"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14Z"/></svg></span>MorvehTV</div>
      <h1>Panel de administración</h1>
      <label class="campo">
        <span>Clave de administración (ADMIN_KEY)</span>
        <input type="password" name="clave" required autocomplete="current-password" />
      </label>
      <button class="btn btn-primario">Entrar</button>
      <p class="error-texto" id="login-error"></p>
    </form>
  </section>

  <div class="panel" id="panel" hidden>
    <aside class="lateral">
      <a href="https://morvehtv.es" class="marca" target="_blank" rel="noopener"><span class="marca-icono"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14Z"/></svg></span><span>MorvehTV</span></a>
      <nav class="lateral-nav" id="pestanas">
        <button data-pestana="resumen" class="activo">Resumen</button>
        <button data-pestana="catalogo">Catálogo</button>
        <button data-pestana="anadir">Añadir título</button>
        <button data-pestana="almacenamiento">Almacenamiento e2</button>
        <button data-pestana="notificaciones">Notificaciones</button>
        <button data-pestana="usuarios">Usuarios</button>
        <button data-pestana="ajustes">Ajustes</button>
      </nav>
      <div class="estado" id="estado"></div>
      <button class="btn btn-secundario btn-chico" id="salir">Cerrar sesión</button>
    </aside>
    <main class="contenido" id="contenido"></main>
  </div>

  <dialog class="dialogo" id="dialogo"></dialog>

  <script src="js/config.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
